<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halo 1 Timer">
<title>Timer for Halo 1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-bar">
  <h1>TIMER FOR HALO 1</h1>
  <button id="options-btn" class="icon-btn" aria-label="Options" title="Options">&#9881;</button>
</header>

<main class="stage">
  <div class="dial">
    <svg viewBox="0 0 200 200" class="ring" aria-hidden="true">
      <circle class="ring-track" cx="100" cy="100" r="88"/>
      <circle class="ring-progress" id="ring" cx="100" cy="100" r="88"/>
    </svg>
    <div class="dial-center">
      <div id="time" class="time">60</div>
      <div id="phase" class="phase">READY</div>
    </div>
  </div>

  <div class="controls">
    <button id="start-btn" class="btn btn-primary">START</button>
    <button id="reset-btn" class="btn btn-ghost">RESET</button>
  </div>

  <div class="items">
    <div class="item" id="item-rockets">
      <img src="img/rockets.png" alt="">
      <span class="item-name">ROCKETS</span>
      <span class="item-time" id="rockets-time">2:00</span>
    </div>
    <div class="item" id="item-powerups">
      <img src="img/powerups.png" alt="">
      <span class="item-name">POWER-UPS</span>
      <span class="item-time" id="powerups-time">1:00</span>
    </div>
  </div>
</main>

<dialog id="options" class="dialog">
  <div class="dialog-body">
    <h2>OPTIONS</h2>
    <label class="row"><input type="checkbox" id="opt-awake" checked> Keep screen on</label>
    <fieldset class="voices">
      <legend>Voice</legend>
      <label class="row"><input type="radio" name="voice" value="american_female" checked> American Female</label>
      <label class="row"><input type="radio" name="voice" value="australian_female"> Australian Female</label>
      <label class="row"><input type="radio" name="voice" value="british_female"> British Female</label>
    </fieldset>
    <div class="dialog-actions">
      <button type="button" id="opt-test" class="btn btn-ghost">Test voice</button>
      <span class="spacer"></span>
      <button type="button" id="opt-close" class="btn btn-primary">Done</button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
