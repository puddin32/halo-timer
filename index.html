<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Halo 1 Timer">
<title>Timer for Halo 1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-bar">
  <span class="app-bar-spacer" aria-hidden="true"></span>
  <h1>TIMER FOR HALO 1</h1>
  <button id="options-btn" class="icon-btn" aria-label="Options" title="Options">&#9881;</button>
</header>

<p class="app-credit" id="app-credit">
  <span id="version-line"></span><br>
  Fan recreation of <a href="https://youtu.be/EXKX3KgPdeo" target="_blank" rel="noopener">Timer for Halo 1</a>
  by Jeff &ldquo;PacMayne&rdquo; Powell.
</p>

<main class="stage">
  <div class="display">
    <div class="dial">
      <svg viewBox="0 0 200 200" class="ring" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="88"/>
        <circle class="ring-progress" id="ring" cx="100" cy="100" r="88"/>
      </svg>
      <div class="dial-center">
        <div id="time" class="time">00:00</div>
      </div>
    </div>
    <img class="item-icon" id="item-icon" src="img/powerups.png" alt="">
  </div>

  <div class="controls">
    <button id="back-btn" class="nudge" aria-label="Move timer back one second">&larr;</button>
    <button id="start-btn" class="btn btn-primary">START</button>
    <button id="fwd-btn" class="nudge" aria-label="Move timer forward one second">&rarr;</button>
  </div>
</main>

<dialog id="options" class="dialog">
  <div class="dialog-body">
    <div class="dialog-head">
      <h2>OPTIONS</h2>
      <button type="button" id="opt-close" class="btn btn-primary">Done</button>
    </div>
    <label class="row"><input type="checkbox" id="opt-awake" checked> Keep screen on</label>
    <label class="row"><input type="checkbox" id="opt-nudge" checked> Show timer sync arrows</label>
    <label class="row"><input type="checkbox" id="opt-credit-toggle" checked> Show credits on main screen</label>
    <fieldset class="opt-group">
      <legend>Voice</legend>
      <div class="voice-row">
        <div class="voice-options">
          <label class="row"><input type="radio" name="voice" value="american_female" checked> American Female</label>
          <label class="row"><input type="radio" name="voice" value="australian_female"> Australian Female</label>
          <label class="row"><input type="radio" name="voice" value="british_female"> British Female</label>
        </div>
        <button type="button" id="opt-test" class="btn btn-ghost">Test voice</button>
      </div>
    </fieldset>
    <fieldset class="opt-group">
      <legend>Audio cues</legend>
      <label class="row"><input type="checkbox" id="cue-n50" checked> 50-second call</label>
      <label class="row"><input type="checkbox" id="cue-n40" checked> 40-second call</label>
      <label class="row"><input type="checkbox" id="cue-n30" checked> 30-second call</label>
      <label class="row"><input type="checkbox" id="cue-n20" checked> 20-second call</label>
      <label class="row"><input type="checkbox" id="cue-final" checked> Final 10-second countdown</label>
    </fieldset>
    <p class="opt-credit">
      Original voice &amp; artwork from <a href="https://youtu.be/EXKX3KgPdeo" target="_blank" rel="noopener">Timer for Halo 1</a>
      by Jeff &ldquo;PacMayne&rdquo; Powell.
      Unofficial &mdash; not affiliated with Microsoft or 343 Industries.
    </p>
    <p class="opt-credit">
      <a href="https://github.com/puddin32/halo1-timer" target="_blank" rel="noopener">View source on GitHub</a>
    </p>
  </div>
</dialog>

<script src="voices.js"></script>
<script src="timer-core.js"></script>
<script src="settings.js"></script>
<script src="app.js"></script>
</body>
</html>
